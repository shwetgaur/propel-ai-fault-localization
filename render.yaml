services:
  - type: web
    name: propel-fault-localization
    runtime: docker
    plan: free
    region: oregon
    branch: master
    repo: https://github.com/shwetgaur/propel-ai-fault-localization
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        value: sqlite:////tmp/faultloc.db
      - key: SEED_ON_STARTUP
        value: "true"
      - key: SEED_POLES
        value: "1800"
      - key: STATIC_DIR
        value: /app/static
      - key: CORS_ORIGINS
        value: "*"
